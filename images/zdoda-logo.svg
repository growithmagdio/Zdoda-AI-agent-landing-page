<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 166 34" fill="none" height="32" aria-label="Zdoda">
  <!-- Zdoda geometric mark -->
  <g id="zdoda-mark">
    <!-- Top lighter purple accent band -->
    <polygon points="1,1 30,1 30,8 9,8" fill="#7C3AED" />
    <!-- Main purple right triangle -->
    <polygon points="9,8 30,8 30,26" fill="#6D28D9" />
    <!-- Bottom purple bar -->
    <rect x="1" y="28" width="29" height="5.5" rx="0.5" fill="#5B21B6" />
  </g>
  <!-- Wordmark ZDODA -->
  <text x="44" y="26" font-family="'Inter', 'Bricolage Grotesque', 'Arial Black', sans-serif" font-size="24" font-weight="900" letter-spacing="-0.02em" fill="#0A0F1C">ZDODA</text>
</svg>
